[project]
name = "parallel-results"
version = "0.1.0"
description = "Result normalisation publishing and report generation worker."
requires-python = ">=3.12"
dependencies = ["parallel-core", "parallel-metrics", "reportlab==5.1.0", "pyarrow==26.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallel_results"]
