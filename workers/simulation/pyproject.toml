[project]
name = "parallel-simulation"
version = "0.1.0"
description = "Engine execution worker."
requires-python = ">=3.12"
dependencies = ["parallel-core", "parallel-engines"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallel_simulation"]
