[project]
name = "parallel-contracts"
version = "0.1.0"
description = "Shared, versioned data contracts for Parallel (scene, domain models, scenarios, runs, results)."
requires-python = ">=3.12"
dependencies = ["pydantic==2.14.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallel_contracts"]
