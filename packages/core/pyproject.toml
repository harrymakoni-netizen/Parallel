[project]
name = "parallel-core"
version = "0.1.0"
description = "Persistence, storage, jobs and run lifecycle shared by API and workers."
requires-python = ">=3.12"
dependencies = ["parallel-contracts", "parallel-engines", "sqlalchemy==2.1.6", "alembic==1.20.1", "psycopg[binary]==3.3.6", "geoalchemy2==0.20.0", "celery[redis]==5.6.3", "pydantic-settings==2.16.1", "boto3==1.43.118"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallel_core"]
