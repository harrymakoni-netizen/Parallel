[project]
name = "parallel-engines"
version = "0.1.0"
description = "Engine adapters, capability records and isolated runtime runners."
requires-python = ">=3.12"
dependencies = ["parallel-contracts", "parallel-scene", "parallel-metrics", "numpy==2.5.4", "shapely==2.2.0", "pyarrow==26.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallel_engines"]
