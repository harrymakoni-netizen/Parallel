[project]
name = "parallel-scene"
version = "0.1.0"
description = "Scene transforms, coordinate handling and geometry validation."
requires-python = ">=3.12"
dependencies = ["parallel-contracts", "numpy==2.5.4", "shapely==2.2.0", "pyproj==3.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallel_scene"]
